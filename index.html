<!doctype html>
<html lang="ru" data-theme="graphite">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="theme-color" content="#111112"/>
    <title>Not Wise: Guide</title>
    <link rel="preload" href="/fonts/Mont-Regular.woff2" as="font" type="font/woff2" crossorigin/>
    <link rel="preload" href="/fonts/Mont-SemiBold.woff2" as="font" type="font/woff2" crossorigin/>
    <link rel="preload" href="/fonts/Mont-Bold.woff2" as="font" type="font/woff2" crossorigin/>
    <script>
      try {
        if (localStorage.getItem('notwise.guide.theme') === 'glass') document.documentElement.dataset.theme = 'glass';
      } catch {}
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="guideLoading" role="status">
        <img src="/brand/notwise.svg" alt="" width="40" height="40"/>
        <span>Загружаем гайд <span class="guideLoadPercent" aria-hidden="true"></span></span>
        <progress aria-label="Загрузка изображений"></progress>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
